<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Clock Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════
   TOKENS & THEME
═══════════════════════════════════════════ */
:root {
  --accent: #00d4ff;
  --accent2: #7b5ea7;
  --danger: #ff4d6d;
  --success: #00c896;
  --warn: #ffb347;
  --rad: 20px;
  --rad-sm: 12px;
  --trans: .35s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg1: #08091a;
  --bg2: #0d1030;
  --glass: rgba(255,255,255,.06);
  --glass-border: rgba(255,255,255,.12);
  --glass-hover: rgba(255,255,255,.1);
  --text1: #e8f0ff;
  --text2: #8899bb;
  --text3: #4a5a80;
  --shadow: rgba(0,0,0,.6);
  --clock-face: rgba(10,15,40,.7);
  --tick: rgba(255,255,255,.2);
  --hand-h: #fff;
  --hand-m: var(--accent);
  --hand-s: var(--danger);
}
[data-theme="light"] {
  --bg1: #dde8f7;
  --bg2: #c8d8f0;
  --glass: rgba(255,255,255,.45);
  --glass-border: rgba(255,255,255,.7);
  --glass-hover: rgba(255,255,255,.6);
  --text1: #0d1a3a;
  --text2: #3a5080;
  --text3: #8099c0;
  --shadow: rgba(80,120,200,.2);
  --clock-face: rgba(200,220,255,.5);
  --tick: rgba(0,0,0,.15);
  --hand-h: #0d1a3a;
  --hand-m: #005fa3;
  --hand-s: var(--danger);
}

/* ═══════════════════════════════════════════
   RESET
═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:'Rajdhani',sans-serif;
  background:var(--bg1);
  color:var(--text1);
  min-height:100vh;
  overflow-x:hidden;
  transition:background var(--trans),color var(--trans);
}

/* ═══════════════════════════════════════════
   ANIMATED BACKGROUND
═══════════════════════════════════════════ */
.bg-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;}
.bg-orb{
  position:absolute;border-radius:50%;filter:blur(80px);
  opacity:.25;animation:orbFloat 12s ease-in-out infinite;
}
.bg-orb:nth-child(1){width:500px;height:500px;background:radial-gradient(#00d4ff,transparent);top:-100px;left:-100px;animation-delay:0s;}
.bg-orb:nth-child(2){width:400px;height:400px;background:radial-gradient(#7b5ea7,transparent);bottom:-80px;right:-80px;animation-delay:-4s;}
.bg-orb:nth-child(3){width:300px;height:300px;background:radial-gradient(#00c896,transparent);top:40%;left:40%;animation-delay:-8s;}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-30px) scale(1.05)}
  66%{transform:translate(-20px,20px) scale(.95)}
}
[data-theme="light"] .bg-orb{opacity:.15}

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
#app{
  position:relative;z-index:1;
  max-width:1200px;margin:0 auto;
  padding:24px 16px 60px;
}

/* ═══════════════════════════════════════════
   GLASS CARD
═══════════════════════════════════════════ */
.card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--rad);
  backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:0 8px 32px var(--shadow);
  transition:background var(--trans),border-color var(--trans),box-shadow var(--trans);
}
.card:hover{background:var(--glass-hover);box-shadow:0 12px 48px var(--shadow);}

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:28px;
  animation:fadeDown .6s ease both;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
.logo{
  font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:.1em;
}
.header-right{display:flex;align-items:center;gap:12px;}
.theme-btn{
  width:52px;height:28px;border-radius:20px;border:1.5px solid var(--glass-border);
  background:var(--glass);cursor:pointer;position:relative;
  transition:var(--trans);overflow:hidden;
}
.theme-btn::after{
  content:'';position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:var(--accent);transition:transform var(--trans),background var(--trans);
}
[data-theme="light"] .theme-btn::after{transform:translateX(24px);background:var(--warn);}
.theme-icon{font-size:1.1rem;cursor:pointer;opacity:.7;transition:opacity .2s;}
.theme-icon:hover{opacity:1;}
#dateHeadline{
  font-size:1rem;font-weight:500;color:var(--text2);
  letter-spacing:.05em;
}

/* ═══════════════════════════════════════════
   TAB NAV
═══════════════════════════════════════════ */
.tabs{
  display:flex;gap:6px;margin-bottom:24px;
  overflow-x:auto;scrollbar-width:none;
  animation:fadeDown .6s .1s ease both;
}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{
  flex-shrink:0;
  padding:9px 18px;border-radius:30px;border:1px solid var(--glass-border);
  background:var(--glass);color:var(--text2);
  font-family:'Rajdhani',sans-serif;font-size:.9rem;font-weight:600;
  letter-spacing:.06em;cursor:pointer;
  transition:var(--trans);white-space:nowrap;
}
.tab-btn:hover{background:var(--glass-hover);color:var(--text1);}
.tab-btn.active{
  background:var(--accent);border-color:var(--accent);
  color:#000;box-shadow:0 0 20px rgba(0,212,255,.4);
}

/* ═══════════════════════════════════════════
   TAB PANELS
═══════════════════════════════════════════ */
.panel{display:none;animation:panelIn .4s ease both;}
.panel.active{display:block;}
@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ═══════════════════════════════════════════
   MAIN CLOCK PANEL (analog + digital)
═══════════════════════════════════════════ */
.main-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  align-items:start;
}
@media(max-width:680px){.main-grid{grid-template-columns:1fr;}}

/* Analog Clock */
.analog-wrap{
  padding:28px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  animation:fadeUp .6s .15s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.clock-svg-wrap{
  position:relative;width:240px;height:240px;
}
#analogSvg{width:100%;height:100%;}

/* Digital display */
.digital-wrap{
  padding:28px;
  display:flex;flex-direction:column;gap:20px;
  animation:fadeUp .6s .25s ease both;
}
.digital-time{
  font-family:'Orbitron',monospace;
  font-size:clamp(2.4rem,6vw,3.8rem);
  font-weight:900;
  color:var(--accent);
  text-shadow:0 0 20px rgba(0,212,255,.5),0 0 60px rgba(0,212,255,.2);
  letter-spacing:.06em;
  line-height:1;
}
.digital-sub{
  display:flex;align-items:center;gap:10px;margin-top:4px;
}
.ampm-badge{
  font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;
  padding:.3em .7em;border-radius:6px;
  background:var(--accent);color:#000;
  box-shadow:0 0 12px rgba(0,212,255,.5);
  transition:background .4s;
}
.tz-text{font-size:.85rem;color:var(--text2);letter-spacing:.08em;}

.info-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.info-cell{
  background:rgba(0,0,0,.15);border-radius:var(--rad-sm);
  padding:12px 14px;border:1px solid var(--glass-border);
}
[data-theme="light"] .info-cell{background:rgba(255,255,255,.25);}
.info-lbl{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.info-val{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--text1);}

/* Day strip */
.day-strip{display:flex;gap:6px;flex-wrap:wrap;}
.day-dot{
  padding:5px 10px;border-radius:20px;font-size:.72rem;font-weight:600;
  letter-spacing:.08em;color:var(--text3);
  border:1px solid transparent;transition:var(--trans);
}
.day-dot.today{
  border-color:var(--accent);color:var(--accent);
  background:rgba(0,212,255,.1);
  box-shadow:0 0 8px rgba(0,212,255,.25);
}

/* ═══════════════════════════════════════════
   STOPWATCH
═══════════════════════════════════════════ */
.sw-wrap{padding:32px;display:flex;flex-direction:column;align-items:center;gap:24px;animation:fadeUp .4s ease both;}
.sw-display{
  font-family:'Orbitron',monospace;font-size:clamp(3rem,10vw,5rem);
  font-weight:900;color:var(--text1);letter-spacing:.05em;
  text-shadow:0 0 30px rgba(0,212,255,.2);
}
.sw-ms{font-size:40%;opacity:.6;vertical-align:super;}
.sw-ring-wrap{position:relative;display:inline-block;}
.sw-ring{transform:rotate(-90deg);overflow:visible;}
#swArc{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;
  transition:stroke-dashoffset .1s linear;filter:drop-shadow(0 0 6px var(--accent));}
#swTrack{fill:none;stroke:var(--glass-border);stroke-width:4;}
.sw-inner{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.btn{
  padding:11px 26px;border-radius:30px;border:none;cursor:pointer;
  font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;
  letter-spacing:.08em;transition:var(--trans);
}
.btn-primary{background:var(--accent);color:#000;box-shadow:0 0 18px rgba(0,212,255,.4);}
.btn-primary:hover{box-shadow:0 0 28px rgba(0,212,255,.6);transform:translateY(-2px);}
.btn-secondary{background:var(--glass);color:var(--text1);border:1px solid var(--glass-border);}
.btn-secondary:hover{background:var(--glass-hover);transform:translateY(-2px);}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 0 14px rgba(255,77,109,.35);}
.btn-danger:hover{box-shadow:0 0 24px rgba(255,77,109,.55);transform:translateY(-2px);}
.btn-success{background:var(--success);color:#000;box-shadow:0 0 14px rgba(0,200,150,.35);}
.btn-success:hover{box-shadow:0 0 24px rgba(0,200,150,.55);transform:translateY(-2px);}
.laps-table{width:100%;border-collapse:collapse;font-size:.9rem;}
.laps-table th{color:var(--text3);font-weight:600;letter-spacing:.1em;text-align:left;padding:6px 10px;border-bottom:1px solid var(--glass-border);}
.laps-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text2);}
.laps-table tr:last-child td{border-bottom:none;}
.laps-table .best{color:var(--success);}
.laps-table .worst{color:var(--danger);}
.laps-scroll{max-height:200px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--glass-border) transparent;}

/* ═══════════════════════════════════════════
   COUNTDOWN TIMER
═══════════════════════════════════════════ */
.cd-wrap{padding:32px;display:flex;flex-direction:column;align-items:center;gap:24px;animation:fadeUp .4s ease both;}
.cd-display{
  font-family:'Orbitron',monospace;font-size:clamp(3rem,10vw,5rem);
  font-weight:900;letter-spacing:.05em;transition:color .4s;
}
.cd-display.running{color:var(--success);text-shadow:0 0 30px rgba(0,200,150,.3);}
.cd-display.idle{color:var(--text1);}
.cd-display.urgent{color:var(--danger);text-shadow:0 0 30px rgba(255,77,109,.4);animation:urgentPulse .5s ease-in-out infinite;}
.cd-display.done{color:var(--warn);text-shadow:0 0 30px rgba(255,179,71,.4);}
@keyframes urgentPulse{0%,100%{opacity:1}50%{opacity:.6}}
.cd-inputs{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center;}
.cd-field{display:flex;flex-direction:column;align-items:center;gap:6px;}
.cd-field label{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);}
.cd-field input{
  width:72px;text-align:center;
  font-family:'Orbitron',monospace;font-size:1.5rem;font-weight:700;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;
  color:var(--text1);padding:10px 6px;
  transition:border-color .2s,box-shadow .2s;
}
.cd-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 12px rgba(0,212,255,.3);}
.cd-sep{font-family:'Orbitron',monospace;font-size:2rem;color:var(--text3);padding-bottom:4px;}
.cd-presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.preset-btn{
  padding:6px 14px;border-radius:20px;border:1px solid var(--glass-border);
  background:var(--glass);color:var(--text2);font-family:'Rajdhani',sans-serif;
  font-size:.85rem;font-weight:600;cursor:pointer;transition:var(--trans);
}
.preset-btn:hover{background:var(--glass-hover);color:var(--accent);border-color:var(--accent);}
.cd-ring-wrap{position:relative;}
#cdArc{fill:none;stroke:var(--success);stroke-width:5;stroke-linecap:round;
  transition:stroke-dashoffset .5s ease,stroke .5s;filter:drop-shadow(0 0 6px var(--success));}
#cdTrack{fill:none;stroke:var(--glass-border);stroke-width:5;}

/* ═══════════════════════════════════════════
   ALARM
═══════════════════════════════════════════ */
.alarm-wrap{padding:28px;display:flex;flex-direction:column;gap:20px;animation:fadeUp .4s ease both;}
.alarm-form{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group label{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);}
.form-group input,.form-group select{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;
  color:var(--text1);font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:500;
  padding:10px 14px;transition:border-color .2s,box-shadow .2s;
}
.form-group input[type="time"]{font-family:'Orbitron',monospace;font-size:1.1rem;}
.form-group input:focus,.form-group select:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 12px rgba(0,212,255,.3);
}
.alarm-list{display:flex;flex-direction:column;gap:10px;}
.alarm-item{
  display:flex;align-items:center;gap:14px;
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:var(--rad-sm);padding:14px 18px;
  transition:var(--trans);
}
.alarm-item:hover{background:var(--glass-hover);}
.alarm-item.fired{border-color:var(--danger);box-shadow:0 0 16px rgba(255,77,109,.3);animation:alarmShake .4s ease;}
@keyframes alarmShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.alarm-time-disp{
  font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:700;
  color:var(--text1);min-width:90px;
}
.alarm-label{flex:1;font-size:.95rem;color:var(--text2);}
.alarm-days{display:flex;gap:4px;flex-wrap:wrap;}
.alarm-day{
  font-size:.65rem;padding:3px 7px;border-radius:12px;
  background:rgba(0,212,255,.1);color:var(--accent);border:1px solid rgba(0,212,255,.2);
}
.toggle-sw{
  position:relative;width:44px;height:24px;cursor:pointer;
}
.toggle-sw input{opacity:0;width:0;height:0;}
.toggle-sw .slider{
  position:absolute;inset:0;border-radius:12px;
  background:var(--text3);transition:.3s;
}
.toggle-sw .slider::before{
  content:'';position:absolute;left:3px;bottom:3px;
  width:18px;height:18px;border-radius:50%;background:#fff;
  transition:.3s;
}
.toggle-sw input:checked+.slider{background:var(--accent);}
.toggle-sw input:checked+.slider::before{transform:translateX(20px);}
.del-btn{
  width:30px;height:30px;border-radius:50%;border:none;
  background:rgba(255,77,109,.15);color:var(--danger);
  cursor:pointer;font-size:1rem;transition:var(--trans);
  display:flex;align-items:center;justify-content:center;
}
.del-btn:hover{background:var(--danger);color:#fff;}
.alarm-ringing{
  display:none;position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,.8);backdrop-filter:blur(10px);
  align-items:center;justify-content:center;
  flex-direction:column;gap:24px;
}
.alarm-ringing.show{display:flex;}
.ring-time{font-family:'Orbitron',monospace;font-size:4rem;font-weight:900;color:var(--danger);
  text-shadow:0 0 40px var(--danger);animation:ringGlow 1s ease-in-out infinite;}
@keyframes ringGlow{0%,100%{text-shadow:0 0 40px var(--danger)}50%{text-shadow:0 0 80px var(--danger),0 0 120px rgba(255,77,109,.3)}}
.ring-label{font-size:1.4rem;color:var(--text2);letter-spacing:.1em;}

/* ═══════════════════════════════════════════
   WORLD CLOCKS
═══════════════════════════════════════════ */
.world-wrap{padding:28px;animation:fadeUp .4s ease both;}
.world-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;
  margin-top:20px;
}
.world-card{
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:var(--rad-sm);padding:18px 20px;
  transition:var(--trans);position:relative;overflow:hidden;
}
.world-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,212,255,.06),transparent);
  pointer-events:none;
}
.world-card:hover{background:var(--glass-hover);transform:translateY(-3px);box-shadow:0 12px 32px var(--shadow);}
.world-city{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.world-time{font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:700;color:var(--text1);line-height:1.1;}
.world-date{font-size:.8rem;color:var(--text2);margin-top:4px;}
.world-offset{
  position:absolute;top:14px;right:14px;
  font-size:.7rem;padding:3px 8px;border-radius:8px;
  background:rgba(0,212,255,.12);color:var(--accent);
  font-weight:600;letter-spacing:.05em;
}
.world-diff{font-size:.75rem;color:var(--text3);margin-top:6px;}
.add-city-form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.city-select{
  flex:1;min-width:180px;
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:10px;color:var(--text1);
  font-family:'Rajdhani',sans-serif;font-size:1rem;padding:10px 14px;
}
.city-select:focus{outline:none;border-color:var(--accent);}

/* ═══════════════════════════════════════════
   WEATHER
═══════════════════════════════════════════ */
.weather-wrap{padding:28px;animation:fadeUp .4s ease both;}
.weather-hero{
  display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;
}
@media(max-width:540px){.weather-hero{grid-template-columns:1fr;}}
.weather-main{
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:var(--rad);padding:28px;
  display:flex;flex-direction:column;gap:10px;
  position:relative;overflow:hidden;
}
.weather-main::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(rgba(0,212,255,.15),transparent);
  pointer-events:none;
}
.weather-icon{font-size:4rem;line-height:1;animation:iconFloat 4s ease-in-out infinite;}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.weather-temp{font-family:'Orbitron',monospace;font-size:3.5rem;font-weight:900;color:var(--text1);line-height:1;}
.weather-desc{font-size:1.1rem;color:var(--text2);text-transform:capitalize;font-weight:500;}
.weather-loc{font-size:.8rem;color:var(--text3);letter-spacing:.15em;text-transform:uppercase;}
.weather-details{
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:var(--rad);padding:24px;
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
}
.w-detail{display:flex;flex-direction:column;gap:4px;}
.w-detail-lbl{font-size:.67rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3);}
.w-detail-val{font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:700;color:var(--text1);}
.forecast-row{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;
}
.fc-card{
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:var(--rad-sm);padding:14px 12px;
  text-align:center;transition:var(--trans);
}
.fc-card:hover{background:var(--glass-hover);transform:translateY(-3px);}
.fc-day{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
.fc-icon{font-size:1.8rem;margin-bottom:6px;}
.fc-temp{font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;color:var(--text1);}
.fc-lo{font-size:.78rem;color:var(--text3);margin-top:2px;}
.weather-loading{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:60px;color:var(--text2);font-size:1.1rem;
}
.spin{
  width:40px;height:40px;border-radius:50%;
  border:3px solid var(--glass-border);
  border-top-color:var(--accent);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.weather-error{
  text-align:center;padding:40px;color:var(--text2);
}
.weather-error p{margin-bottom:16px;font-size:1rem;}

/* ═══════════════════════════════════════════
   TOAST
═══════════════════════════════════════════ */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:9000;
  background:var(--glass);border:1px solid var(--glass-border);
  backdrop-filter:blur(20px);border-radius:12px;
  padding:14px 20px;font-size:.95rem;color:var(--text1);
  box-shadow:0 8px 32px var(--shadow);
  transform:translateY(20px);opacity:0;
  transition:transform .3s ease,opacity .3s ease;
  pointer-events:none;max-width:320px;
}
.toast.show{transform:none;opacity:1;}
.toast.success{border-color:var(--success);}
.toast.error{border-color:var(--danger);}

/* ═══════════════════════════════════════════
   ALARM RINGING OVERLAY
═══════════════════════════════════════════ */
.ring-pulse{
  width:120px;height:120px;border-radius:50%;
  border:3px solid var(--danger);
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;
  animation:ringPulse 1s ease-in-out infinite;
}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,109,.5)}50%{box-shadow:0 0 0 20px rgba(255,77,109,0)}}

/* ═══════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════ */
@media(max-width:480px){
  .analog-wrap{padding:20px;}
  .clock-svg-wrap{width:200px;height:200px;}
  .digital-wrap{padding:20px;}
  .sw-wrap,.cd-wrap,.alarm-wrap,.world-wrap,.weather-wrap{padding:20px;}
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-canvas">
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
</div>

<!-- Alarm Ringing Overlay -->
<div class="alarm-ringing" id="alarmRinging">
  <div class="ring-pulse">⏰</div>
  <div class="ring-time" id="ringTime">00:00</div>
  <div class="ring-label" id="ringLabel">Alarm</div>
  <div style="display:flex;gap:12px;">
    <button class="btn btn-danger" onclick="dismissAlarm()">Dismiss</button>
    <button class="btn btn-secondary" onclick="snoozeAlarm()">Snooze 5 min</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<div id="app">
  <!-- Header -->
  <header>
    <div>
      <div class="logo">⧖ CLOCK SUITE</div>
      <div id="dateHeadline"></div>
    </div>
    <div class="header-right">
      <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme"></button>
    </div>
  </header>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('main',this)">🕐 Clock</button>
    <button class="tab-btn" onclick="switchTab('stopwatch',this)">⏱ Stopwatch</button>
    <button class="tab-btn" onclick="switchTab('countdown',this)">⏳ Countdown</button>
    <button class="tab-btn" onclick="switchTab('alarm',this)">⏰ Alarm</button>
    <button class="tab-btn" onclick="switchTab('world',this)">🌍 World</button>
    <button class="tab-btn" onclick="switchTab('weather',this)">🌤 Weather</button>
  </div>

  <!-- ── MAIN CLOCK ── -->
  <div class="panel active" id="panel-main">
    <div class="main-grid">

      <!-- Analog -->
      <div class="card analog-wrap">
        <div class="clock-svg-wrap">
          <svg id="analogSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Face -->
            <circle cx="100" cy="100" r="96" fill="var(--clock-face)" stroke="var(--glass-border)" stroke-width="1.5"/>
            <!-- Glow ring -->
            <circle cx="100" cy="100" r="96" fill="none" stroke="var(--accent)" stroke-width="1" opacity=".3"/>
            <!-- Tick marks -->
            <g id="ticks"></g>
            <!-- Numbers -->
            <g id="nums" font-family="Orbitron,monospace" font-size="9" font-weight="700" fill="var(--text2)" text-anchor="middle" dominant-baseline="central"></g>
            <!-- Second arc (background) -->
            <circle id="secTrack" cx="100" cy="100" r="88" fill="none" stroke="var(--glass-border)" stroke-width="2.5"/>
            <!-- Second arc -->
            <circle id="secArcSvg" cx="100" cy="100" r="88" fill="none" stroke="var(--danger)" stroke-width="2.5"
              stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="0 552" style="filter:drop-shadow(0 0 4px var(--danger));transition:stroke-dasharray .25s linear"/>
            <!-- Hands -->
            <line id="handH" x1="100" y1="100" x2="100" y2="46" stroke="var(--hand-h)" stroke-width="5" stroke-linecap="round"/>
            <line id="handM" x1="100" y1="100" x2="100" y2="34" stroke="var(--hand-m)" stroke-width="3.5" stroke-linecap="round"/>
            <line id="handS" x1="100" y1="100" x2="100" y2="22" stroke="var(--hand-s)" stroke-width="1.5" stroke-linecap="round"/>
            <line id="handSback" x1="100" y1="100" x2="100" y2="115" stroke="var(--hand-s)" stroke-width="1.5" stroke-linecap="round"/>
            <!-- Centre dot -->
            <circle cx="100" cy="100" r="5" fill="var(--accent)" style="filter:drop-shadow(0 0 6px var(--accent))"/>
            <circle cx="100" cy="100" r="2.5" fill="#000"/>
          </svg>
        </div>
      </div>

      <!-- Digital -->
      <div class="card digital-wrap">
        <div>
          <div class="digital-time" id="digitalTime">12:00:00</div>
          <div class="digital-sub">
            <span class="ampm-badge" id="digitalAmPm">AM</span>
            <span class="tz-text" id="digitalTz"></span>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-cell">
            <div class="info-lbl">Day</div>
            <div class="info-val" id="infoDay">—</div>
          </div>
          <div class="info-cell">
            <div class="info-lbl">Week</div>
            <div class="info-val" id="infoWeek">—</div>
          </div>
          <div class="info-cell">
            <div class="info-lbl">Date</div>
            <div class="info-val" id="infoDate">—</div>
          </div>
          <div class="info-cell">
            <div class="info-lbl">Year</div>
            <div class="info-val" id="infoYear">—</div>
          </div>
        </div>

        <div>
          <div class="info-lbl" style="margin-bottom:8px">This Week</div>
          <div class="day-strip" id="dayStrip"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── STOPWATCH ── -->
  <div class="panel" id="panel-stopwatch">
    <div class="card sw-wrap">
      <div class="sw-ring-wrap">
        <svg class="sw-ring" width="220" height="220" viewBox="0 0 220 220">
          <circle class="" id="swTrack" cx="110" cy="110" r="100" fill="none" stroke="var(--glass-border)" stroke-width="4"/>
          <circle id="swArc" cx="110" cy="110" r="100" fill="none" stroke="var(--accent)" stroke-width="4"
            stroke-linecap="round" stroke-dasharray="0 628" style="filter:drop-shadow(0 0 6px var(--accent))"/>
        </svg>
        <div class="sw-inner">
          <div class="sw-display" id="swDisplay">00:00<span class="sw-ms">.00</span></div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="swStartBtn" onclick="swToggle()">START</button>
        <button class="btn btn-secondary" id="swLapBtn" onclick="swLap()" disabled>LAP</button>
        <button class="btn btn-danger" id="swResetBtn" onclick="swReset()" disabled>RESET</button>
      </div>

      <div id="swLapsWrap" style="width:100%;display:none;">
        <div class="laps-scroll">
          <table class="laps-table">
            <thead><tr><th>#</th><th>Lap Time</th><th>Total</th></tr></thead>
            <tbody id="swLapsTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ── COUNTDOWN ── -->
  <div class="panel" id="panel-countdown">
    <div class="card cd-wrap">
      <div class="cd-ring-wrap">
        <svg width="220" height="220" viewBox="0 0 220 220" style="transform:rotate(-90deg);overflow:visible">
          <circle id="cdTrack" cx="110" cy="110" r="100" fill="none" stroke="var(--glass-border)" stroke-width="5"/>
          <circle id="cdArc" cx="110" cy="110" r="100" fill="none" stroke="var(--success)" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="628 628" stroke-dashoffset="0"
            style="transition:stroke-dashoffset .5s ease;filter:drop-shadow(0 0 6px var(--success))"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <div class="cd-display idle" id="cdDisplay">00:00:00</div>
        </div>
      </div>

      <div class="cd-inputs" id="cdInputArea">
        <div class="cd-field">
          <label>Hours</label>
          <input type="number" id="cdH" min="0" max="99" value="0"/>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-field">
          <label>Minutes</label>
          <input type="number" id="cdM" min="0" max="59" value="5"/>
        </div>
        <span class="cd-sep">:</span>
        <div class="cd-field">
          <label>Seconds</label>
          <input type="number" id="cdS" min="0" max="59" value="0"/>
        </div>
      </div>

      <div class="cd-presets">
        <button class="preset-btn" onclick="cdPreset(1,0,0)">1 hr</button>
        <button class="preset-btn" onclick="cdPreset(0,30,0)">30 min</button>
        <button class="preset-btn" onclick="cdPreset(0,15,0)">15 min</button>
        <button class="preset-btn" onclick="cdPreset(0,10,0)">10 min</button>
        <button class="preset-btn" onclick="cdPreset(0,5,0)">5 min</button>
        <button class="preset-btn" onclick="cdPreset(0,1,0)">1 min</button>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="cdStartBtn" onclick="cdToggle()">START</button>
        <button class="btn btn-danger" id="cdResetBtn" onclick="cdReset()">RESET</button>
      </div>
    </div>
  </div>

  <!-- ── ALARM ── -->
  <div class="panel" id="panel-alarm">
    <div class="card alarm-wrap">
      <div class="alarm-form">
        <div class="form-group">
          <label>Time</label>
          <input type="time" id="alarmTime"/>
        </div>
        <div class="form-group">
          <label>Label</label>
          <input type="text" id="alarmLabel" placeholder="Wake up!" style="width:160px"/>
        </div>
        <div class="form-group">
          <label>Repeat</label>
          <select id="alarmRepeat">
            <option value="once">Once</option>
            <option value="daily">Daily</option>
            <option value="weekdays">Weekdays</option>
            <option value="weekends">Weekends</option>

        <button class="btn btn-primary" onclick="addAlarm()" style="align-self:flex-end">+ ADD</button>

      </div>

  <!-- ── WORLD CLOCKS ── -->
  <div class="panel" id="panel-world">
    <div class="card world-wrap">
      <div class="add-city-form">
        <select class="city-select" id="citySelect">
          <option value="">— Add a city —</option>
        </select>
        <button class="btn btn-primary" onclick="addWorldClock()">+ ADD</button>
      </div>
      <div class="world-grid" id="worldGrid"></div>
    </div>

  <!-- ── WEATHER ── -->
  <div class="panel" id="panel-weather">
    <div class="card weather-wrap">
      <div id="weatherContent">

          <div class="spin"></div>
          <span>Detecting your location…</span>
        </div>
      </div>
    </div>
  </div>

</div><!-- /app -->

<script>
/* ══════════════════════════════════════════
   UTILITIES
══════════════════════════════════════════ */
const pad = n => String(n).padStart(2,'0');
const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS_FULL  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS     = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function getWeekNumber(d){
  const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  date.setUTCDate(date.getUTCDate()+4-(date.getUTCDay()||7));
  const yearStart=new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date-yearStart)/86400000)+1)/7);
}

function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+(type||'');
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),3000);
}

/* ══════════════════════════════════════════
   THEME
══════════════════════════════════════════ */
function toggleTheme(){
  const html=document.documentElement;
  html.dataset.theme=html.dataset.theme==='dark'?'light':'dark';
}

/* ══════════════════════════════════════════
   TABS
══════════════════════════════════════════ */
function switchTab(id,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='weather') initWeather();
}

/* ══════════════════════════════════════════
   ANALOG CLOCK SETUP
══════════════════════════════════════════ */
(function buildClock(){
  const tg=document.getElementById('ticks');
  const ng=document.getElementById('nums');
  for(let i=0;i<60;i++){
    const a=(i/60)*2*Math.PI-Math.PI/2;
    const isMaj=i%5===0;
    const r1=isMaj?80:84, r2=90;
    const x1=100+r1*Math.cos(a), y1=100+r1*Math.sin(a);
    const x2=100+r2*Math.cos(a), y2=100+r2*Math.sin(a);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('stroke',isMaj?'var(--text2)':'var(--tick)');
    line.setAttribute('stroke-width',isMaj?2:1);
    tg.appendChild(line);
    if(isMaj){
      const num=i===0?12:i/5;
      const nr=70;
      const nx=100+nr*Math.cos(a), ny=100+nr*Math.sin(a);
      const text=document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x',nx); text.setAttribute('y',ny);
      text.textContent=num;
      ng.appendChild(text);
    }
  }
})();

function rotateHand(id,deg){
  const el=document.getElementById(id);
  if(!el)return;
  // Use transform attribute for hand rotation around clock centre
  el.setAttribute('transform',`rotate(${deg},100,100)`);
}

/* ══════════════════════════════════════════
   MAIN CLOCK TICK
══════════════════════════════════════════ */
const DAY_PILLS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
(function buildDayStrip(){
  const strip=document.getElementById('dayStrip');
  DAY_PILLS.forEach(d=>{
    const span=document.createElement('span');
    span.className='day-dot'; span.textContent=d; span.dataset.d=d;
    strip.appendChild(span);
  });
})();

let prevSec=-1;
function mainTick(){
  const now=new Date();
  const h=now.getHours(), m=now.getMinutes(), s=now.getSeconds(), ms=now.getMilliseconds();

  /* Analog smooth */
  const sDeg=(s+ms/1000)/60*360;
  const mDeg=(m+s/60)/60*360;
  const hDeg=(h%12+(m/60))/12*360;
  rotateHand('handH',hDeg);
  rotateHand('handM',mDeg);
  rotateHand('handS',sDeg);
  rotateHand('handSback',sDeg);

  /* Second arc on analog */
  const circ=2*Math.PI*88;
  const prog=(s+ms/1000)/60;
  document.getElementById('secArcSvg').setAttribute('stroke-dasharray',`${prog*circ} ${circ}`);

  if(s!==prevSec){
    prevSec=s;
    /* Digital */
    const h12=h%12||12, ap=h>=12?'PM':'AM';
    document.getElementById('digitalTime').textContent=`${pad(h12)}:${pad(m)}:${pad(s)}`;
    document.getElementById('digitalAmPm').textContent=ap;
    /* Info cells */
    document.getElementById('infoDay').textContent=DAYS_SHORT[now.getDay()];
    document.getElementById('infoDate').textContent=`${pad(now.getDate())} ${MONTHS_SHORT[now.getMonth()]}`;
    document.getElementById('infoWeek').textContent=`W${getWeekNumber(now)}`;
    document.getElementById('infoYear').textContent=now.getFullYear();
    /* Date headline */
    document.getElementById('dateHeadline').textContent=
      `${DAYS_FULL[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    /* Timezone */
    try{ document.getElementById('digitalTz').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone; }catch{}
    /* Day strip */
    const today=DAYS_SHORT[now.getDay()];
    document.querySelectorAll('.day-dot').forEach(p=>p.classList.toggle('today',p.dataset.d===today));
    /* Check alarms */
    checkAlarms(h,m,s);
  }
}
mainTick();
setInterval(mainTick,50);

/* ══════════════════════════════════════════
   STOPWATCH
══════════════════════════════════════════ */
let swRunning=false, swStart=0, swElapsed=0, swInterval=null, swLaps=[];
const swPerim=2*Math.PI*100;

function swFormat(ms){
  const totalSec=Math.floor(ms/1000);
  const min=Math.floor(totalSec/60), sec=totalSec%60, cent=Math.floor((ms%1000)/10);
  return `${pad(min)}:${pad(sec)}<span class="sw-ms">.${pad(cent)}</span>`;
}
function swUpdate(){
  const el=swElapsed+(swRunning?Date.now()-swStart:0);
  document.getElementById('swDisplay').innerHTML=swFormat(el);
  const sec=(el/1000)%60;
  const arc=(sec/60)*swPerim;
  document.getElementById('swArc').style.strokeDasharray=`${arc} ${swPerim}`;
}
function swToggle(){
  if(!swRunning){
    swStart=Date.now(); swRunning=true;
    swInterval=setInterval(swUpdate,30);
    document.getElementById('swStartBtn').textContent='PAUSE';
    document.getElementById('swStartBtn').className='btn btn-secondary';
    document.getElementById('swLapBtn').disabled=false;
    document.getElementById('swResetBtn').disabled=false;
  } else {
    swElapsed+=Date.now()-swStart; swRunning=false;
    clearInterval(swInterval);
    document.getElementById('swStartBtn').textContent='RESUME';
    document.getElementById('swStartBtn').className='btn btn-primary';
  }
}
function swLap(){
  const el=swElapsed+(swRunning?Date.now()-swStart:0);
  const prev=swLaps.length?swLaps[swLaps.length-1].total:0;
  swLaps.push({lap:el-prev,total:el});
  renderLaps();
  document.getElementById('swLapsWrap').style.display='block';
}
function swReset(){
  swRunning=false; clearInterval(swInterval);
  swElapsed=0; swStart=0; swLaps=[];
  document.getElementById('swDisplay').innerHTML='00:00<span class="sw-ms">.00</span>';
  document.getElementById('swArc').style.strokeDasharray=`0 ${swPerim}`;
  document.getElementById('swStartBtn').textContent='START';
  document.getElementById('swStartBtn').className='btn btn-primary';
  document.getElementById('swLapBtn').disabled=true;
  document.getElementById('swResetBtn').disabled=true;
  document.getElementById('swLapsWrap').style.display='none';
  document.getElementById('swLapsTbody').innerHTML='';
}
function renderLaps(){
  const tbody=document.getElementById('swLapsTbody');
  const times=swLaps.map(l=>l.lap);
  const best=Math.min(...times), worst=Math.max(...times);
  tbody.innerHTML='';
  [...swLaps].reverse().forEach((l,i)=>{
    const num=swLaps.length-i;
    const tr=document.createElement('tr');
    const cls=l.lap===best?'best':l.lap===worst&&swLaps.length>1?'worst':'';
    tr.innerHTML=`<td>${num}</td><td class="${cls}">${fmtMs(l.lap)}</td><td>${fmtMs(l.total)}</td>`;
    tbody.appendChild(tr);
  });
}
function fmtMs(ms){
  const s=Math.floor(ms/1000), min=Math.floor(s/60), sec=s%60, cent=Math.floor((ms%1000)/10);
  return `${pad(min)}:${pad(sec)}.${pad(cent)}`;
}

/* ══════════════════════════════════════════
   COUNTDOWN
══════════════════════════════════════════ */
let cdRunning=false, cdTotal=0, cdRemaining=0, cdInterval=null;
const cdPerim=2*Math.PI*100;

function cdPreset(h,m,s){
  cdReset();
  document.getElementById('cdH').value=h;
  document.getElementById('cdM').value=m;
  document.getElementById('cdS').value=s;
}
function cdToggle(){
  if(!cdRunning){
    if(cdRemaining<=0){
      const h=+document.getElementById('cdH').value||0;
      const m=+document.getElementById('cdM').value||0;
      const s=+document.getElementById('cdS').value||0;
      cdTotal=(h*3600+m*60+s)*1000;
      cdRemaining=cdTotal;
    }
    if(cdRemaining<=0){showToast('Set a duration first','error');return;}
    cdRunning=true;
    document.getElementById('cdStartBtn').textContent='PAUSE';
    document.getElementById('cdInputArea').style.opacity='.4';
    document.getElementById('cdInputArea').style.pointerEvents='none';
    const endTime=Date.now()+cdRemaining;
    cdInterval=setInterval(()=>{
      cdRemaining=endTime-Date.now();
      if(cdRemaining<=0){cdRemaining=0;cdRunning=false;clearInterval(cdInterval);cdDone();}
      cdRender();
    },200);
    cdRender();
  } else {
    cdRunning=false; clearInterval(cdInterval);
    document.getElementById('cdStartBtn').textContent='RESUME';
  }
}
function cdRender(){
  const r=Math.max(0,cdRemaining);
  const ts=Math.ceil(r/1000);
  const h=Math.floor(ts/3600), m=Math.floor((ts%3600)/60), s=ts%60;
  const disp=document.getElementById('cdDisplay');
  disp.textContent=`${pad(h)}:${pad(m)}:${pad(s)}`;
  const prog=cdTotal>0?r/cdTotal:0;
  document.getElementById('cdArc').style.strokeDashoffset=cdPerim*(1-prog);
  if(r<=0){disp.className='cd-display done';}
  else if(r<=10000){disp.className='cd-display urgent';}
  else if(cdRunning){disp.className='cd-display running';}
  else{disp.className='cd-display idle';}
  const pct=prog;
  const r2=`rgb(${Math.round((1-pct)*255)},${Math.round(pct*200)},${Math.round(pct*150)})`;
  document.getElementById('cdArc').style.stroke=r<=10000?'var(--danger)':'var(--success)';
  document.getElementById('cdArc').style.filter=r<=10000?'drop-shadow(0 0 8px var(--danger))':'drop-shadow(0 0 6px var(--success))';
}
function cdDone(){
  document.getElementById('cdStartBtn').textContent='START';
  document.getElementById('cdInputArea').style.opacity='1';
  document.getElementById('cdInputArea').style.pointerEvents='auto';
  showToast('⏳ Countdown finished!','success');
  // Play beep
  try{
    const ac=new AudioContext();
    for(let i=0;i<3;i++){
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(.3,ac.currentTime+i*.4);
      g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.4+.35);
      o.start(ac.currentTime+i*.4); o.stop(ac.currentTime+i*.4+.4);
    }
  }catch{}
}
function cdReset(){
  cdRunning=false; clearInterval(cdInterval);
  cdRemaining=0; cdTotal=0;
  document.getElementById('cdDisplay').textContent='00:00:00';
  document.getElementById('cdDisplay').className='cd-display idle';
  document.getElementById('cdArc').style.strokeDashoffset=0;
  document.getElementById('cdStartBtn').textContent='START';
  document.getElementById('cdInputArea').style.opacity='1';
  document.getElementById('cdInputArea').style.pointerEvents='auto';
}

/* ══════════════════════════════════════════
   ALARM
══════════════════════════════════════════ */
let alarms=[], firingAlarm=null;

function addAlarm(){
  const t=document.getElementById('alarmTime').value;
  const l=document.getElementById('alarmLabel').value||'Alarm';
  const r=document.getElementById('alarmRepeat').value;
  if(!t){showToast('Please set a time','error');return;}
  alarms.push({id:Date.now(),time:t,label:l,repeat:r,enabled:true,fired:false});
  renderAlarms();
  showToast('Alarm set for '+t,'success');
}
function renderAlarms(){
  const list=document.getElementById('alarmList');
  if(!alarms.length){
    list.innerHTML='<div style="color:var(--text3);font-size:.9rem;padding:20px 0;text-align:center;">No alarms set. Add one above.</div>';
    return;
  }
  list.innerHTML='';
  [...alarms].sort((a,b)=>a.time.localeCompare(b.time)).forEach(al=>{
    const div=document.createElement('div');
    div.className='alarm-item'+(al.fired?' fired':'');
    div.id='alarm-'+al.id;
    const repMap={once:'Once',daily:'Every day',weekdays:'Weekdays',weekends:'Weekends'};
    div.innerHTML=`
      <div class="alarm-time-disp">${al.time}</div>
      <div style="flex:1">
        <div style="font-weight:600;font-size:1rem">${al.label}</div>
        <div style="font-size:.78rem;color:var(--text3);margin-top:2px">${repMap[al.repeat]}</div>
      </div>
      <label class="toggle-sw"><input type="checkbox" ${al.enabled?'checked':''} onchange="toggleAlarm(${al.id},this.checked)"/><span class="slider"></span></label>
      <button class="del-btn" onclick="deleteAlarm(${al.id})">✕</button>
    `;
    list.appendChild(div);
  });
}
function toggleAlarm(id,val){ const a=alarms.find(a=>a.id===id); if(a){a.enabled=val;a.fired=false;} }
function deleteAlarm(id){ alarms=alarms.filter(a=>a.id!==id); renderAlarms(); }

function checkAlarms(h,m,s){
  if(s!==0) return;
  const now=new Date();
  const dow=now.getDay();
  const timeStr=`${pad(h)}:${pad(m)}`;
  alarms.forEach(al=>{
    if(!al.enabled||al.fired) return;
    if(al.time!==timeStr) return;
    const ok=al.repeat==='once'||al.repeat==='daily'||
      (al.repeat==='weekdays'&&dow>=1&&dow<=5)||
      (al.repeat==='weekends'&&(dow===0||dow===6));
    if(ok){ fireAlarm(al); if(al.repeat==='once') al.enabled=false; }
  });
}
function fireAlarm(al){
  firingAlarm=al; al.fired=true;
  document.getElementById('ringTime').textContent=al.time;
  document.getElementById('ringLabel').textContent=al.label;
  document.getElementById('alarmRinging').classList.add('show');
  try{
    const ac=new AudioContext();
    function beep(t){
      const o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type='triangle'; o.frequency.value=660;
      g.gain.setValueAtTime(.4,t); g.gain.exponentialRampToValueAtTime(.001,t+.4);
      o.start(t); o.stop(t+.45);
    }
    for(let i=0;i<6;i++) beep(ac.currentTime+i*.5);
  }catch{}
}
function dismissAlarm(){
  document.getElementById('alarmRinging').classList.remove('show');
  firingAlarm=null; renderAlarms();
}
function snoozeAlarm(){
  document.getElementById('alarmRinging').classList.remove('show');
  if(firingAlarm){
    const [hh,mm]=firingAlarm.time.split(':').map(Number);
    const d=new Date(); d.setHours(hh,mm+5,0,0);
    const nh=pad(d.getHours()), nm=pad(d.getMinutes());
    alarms.push({id:Date.now(),time:`${nh}:${nm}`,label:firingAlarm.label+' (Snoozed)',repeat:'once',enabled:true,fired:false});
    renderAlarms();
    showToast('Snoozed for 5 minutes');
  }
  firingAlarm=null;
}

/* ══════════════════════════════════════════
   WORLD CLOCKS
══════════════════════════════════════════ */
const WORLD_CITIES=[
  {city:'New York',tz:'America/New_York',emoji:'🗽'},
  {city:'Los Angeles',tz:'America/Los_Angeles',emoji:'🎬'},
  {city:'Chicago',tz:'America/Chicago',emoji:'🌆'},
  {city:'London',tz:'Europe/London',emoji:'🎡'},
  {city:'Paris',tz:'Europe/Paris',emoji:'🗼'},
  {city:'Berlin',tz:'Europe/Berlin',emoji:'🏛'},
  {city:'Dubai',tz:'Asia/Dubai',emoji:'🏙'},
  {city:'Mumbai',tz:'Asia/Kolkata',emoji:'🕌'},
  {city:'Singapore',tz:'Asia/Singapore',emoji:'🦁'},
  {city:'Tokyo',tz:'Asia/Tokyo',emoji:'⛩'},
  {city:'Sydney',tz:'Australia/Sydney',emoji:'🦘'},
  {city:'São Paulo',tz:'America/Sao_Paulo',emoji:'🌴'},
  {city:'Toronto',tz:'America/Toronto',emoji:'🍁'},
  {city:'Seoul',tz:'Asia/Seoul',emoji:'🎎'},
  {city:'Shanghai',tz:'Asia/Shanghai',emoji:'🏮'},
  {city:'Moscow',tz:'Europe/Moscow',emoji:'🏰'},
  {city:'Cairo',tz:'Africa/Cairo',emoji:'🏺'},
  {city:'Nairobi',tz:'Africa/Nairobi',emoji:'🦒'},
];
let activeCities=['New York','London','Tokyo','Sydney'];

(function initWorldSelect(){
  const sel=document.getElementById('citySelect');
  WORLD_CITIES.forEach(c=>{
    const o=document.createElement('option');
    o.value=c.city; o.textContent=`${c.emoji} ${c.city}`;
    sel.appendChild(o);
  });
})();

function addWorldClock(){
  const val=document.getElementById('citySelect').value;
  if(!val){showToast('Select a city','error');return;}
  if(activeCities.includes(val)){showToast('Already added','error');return;}
  activeCities.push(val);
  renderWorldClocks();
  document.getElementById('citySelect').value='';
}

function getLocalOffset(tz){
  const now=new Date();
  const here=now.toLocaleString('en-US',{timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,hour:'numeric',minute:'numeric',hour12:false});
  const there=now.toLocaleString('en-US',{timeZone:tz,hour:'numeric',minute:'numeric',hour12:false});
  try{
    const [hh,mm]=here.split(':').map(Number);
    const [th,tm]=there.split(':').map(Number);
    const diff=((th*60+tm)-(hh*60+mm));
    const sign=diff>=0?'+':'-';
    const abs=Math.abs(diff);
    return `${sign}${Math.floor(abs/60)}h${abs%60?pad(abs%60)+'m':''}`;
  }catch{return '';}
}

function renderWorldClocks(){
  const grid=document.getElementById('worldGrid');
  grid.innerHTML='';
  activeCities.forEach(city=>{
    const info=WORLD_CITIES.find(c=>c.city===city);
    if(!info) return;
    const div=document.createElement('div');
    div.className='world-card'; div.id='wc-'+city.replace(/\s/g,'_');
    const offset=getLocalOffset(info.tz);
    div.innerHTML=`
      <div class="world-city">${info.emoji} ${info.city}</div>
      <div class="world-time" id="wt-${city.replace(/\s/g,'_')}">--:--:--</div>
      <div class="world-date" id="wd-${city.replace(/\s/g,'_')}">---</div>
      <div class="world-diff">${offset} from local</div>
      <button onclick="removeWorldClock('${city}')" class="del-btn" style="position:absolute;top:12px;right:12px">✕</button>
    `;
    grid.appendChild(div);
  });
}
function removeWorldClock(city){
  activeCities=activeCities.filter(c=>c!==city);
  renderWorldClocks();
}
function updateWorldClocks(){
  const now=new Date();
  activeCities.forEach(city=>{
    const info=WORLD_CITIES.find(c=>c.city===city);
    if(!info) return;
    try{
      const t=now.toLocaleString('en-US',{timeZone:info.tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
      const d=now.toLocaleString('en-US',{timeZone:info.tz,weekday:'short',month:'short',day:'numeric'});
      const tid=document.getElementById('wt-'+city.replace(/\s/g,'_'));
      const did=document.getElementById('wd-'+city.replace(/\s/g,'_'));
      if(tid) tid.textContent=t;
      if(did) did.textContent=d;
    }catch{}
  });
}
renderWorldClocks();
setInterval(updateWorldClocks,1000);
updateWorldClocks();

/* ══════════════════════════════════════════
   WEATHER
══════════════════════════════════════════ */
let weatherLoaded=false;
const WX_ICONS={
  0:'☀️',1:'🌤',2:'⛅',3:'☁️',
  45:'🌫',48:'🌫',
  51:'🌦',53:'🌦',55:'🌧',
  61:'🌧',63:'🌧',65:'🌧',
  71:'🌨',73:'🌨',75:'❄️',
  80:'🌦',81:'🌧',82:'⛈',
  95:'⛈',96:'⛈',99:'⛈'
};
const WX_DESC={
  0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
  45:'Fog',48:'Icy fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Light rain',63:'Moderate rain',65:'Heavy rain',
  71:'Light snow',73:'Moderate snow',75:'Heavy snow',
  80:'Rain showers',81:'Heavy showers',82:'Violent showers',
  95:'Thunderstorm',96:'Thunderstorm + hail',99:'Severe thunderstorm'
};

function initWeather(){
  if(weatherLoaded) return;
  if(!navigator.geolocation){
    showWeatherError('Geolocation not supported by this browser.');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos=>fetchWeather(pos.coords.latitude,pos.coords.longitude),
    ()=>showWeatherError('Location access denied. Please allow location to see weather.')
  );
}

async function fetchWeather(lat,lon){
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`;
    const geo=`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`;

    const [wx,loc]=await Promise.all([
      fetch(url).then(r=>r.json()),
      fetch(geo).then(r=>r.json()).catch(()=>({address:{city:'Your Location',country:''}}))
    ]);

    const c=wx.current;
    const city=loc.address?.city||loc.address?.town||loc.address?.village||loc.address?.county||'Your Location';
    const country=loc.address?.country_code?.toUpperCase()||'';
    const icon=WX_ICONS[c.weather_code]||'🌡';
    const desc=WX_DESC[c.weather_code]||'Unknown';
    const temp=Math.round(c.temperature_2m);
    const feels=Math.round(c.apparent_temperature);
    const humid=c.relative_humidity_2m;
    const wind=Math.round(c.wind_speed_10m);
    const press=Math.round(c.surface_pressure);

    let fcCards='';
    wx.daily.date.slice(1).forEach((date,i)=>{
      const d=new Date(date+'T00:00:00');
      const dayName=i===0?'Tomorrow':DAYS_SHORT[d.getDay()];
      const fi=WX_ICONS[wx.daily.weather_code[i+1]]||'🌡';
      const hi=Math.round(wx.daily.temperature_2m_max[i+1]);
      const lo=Math.round(wx.daily.temperature_2m_min[i+1]);
      fcCards+=`<div class="fc-card"><div class="fc-day">${dayName}</div><div class="fc-icon">${fi}</div><div class="fc-temp">${hi}°</div><div class="fc-lo">${lo}°</div></div>`;
    });

    document.getElementById('weatherContent').innerHTML=`
      <div class="weather-hero">
        <div class="weather-main">
          <div class="weather-icon">${icon}</div>
          <div class="weather-temp">${temp}°C</div>
          <div class="weather-desc">${desc}</div>
          <div class="weather-loc">📍 ${city}${country?' · '+country:''}</div>
        </div>
        <div class="weather-details">
          <div class="w-detail"><div class="w-detail-lbl">Feels like</div><div class="w-detail-val">${feels}°C</div></div>
          <div class="w-detail"><div class="w-detail-lbl">Humidity</div><div class="w-detail-val">${humid}%</div></div>
          <div class="w-detail"><div class="w-detail-lbl">Wind</div><div class="w-detail-val">${wind} km/h</div></div>
          <div class="w-detail"><div class="w-detail-lbl">Pressure</div><div class="w-detail-val">${press} hPa</div></div>
        </div>
      </div>
      <div style="margin-bottom:14px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text3)">5-Day Forecast</div>
      <div class="forecast-row">${fcCards}</div>
      <div style="margin-top:20px;font-size:.72rem;color:var(--text3);text-align:right">Data: Open-Meteo · Location: OpenStreetMap</div>
    `;
    weatherLoaded=true;
  } catch(e){
    showWeatherError('Could not load weather data. Check your connection.');
  }
}

function showWeatherError(msg){
  document.getElementById('weatherContent').innerHTML=`
    <div class="weather-error">
      <div style="font-size:3rem;margin-bottom:12px">🌧</div>
      <p>${msg}</p>
      <button class="btn btn-primary" onclick="weatherLoaded=false;initWeather()">Retry</button>
    </div>
  `;
}
</script>
